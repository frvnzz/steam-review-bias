project:
  type: default
  output-dir: _site
  render:
    - index.qmd
  resources:
    - js/vendor/lenis/
    - images/
    - fonts/OFL.txt   # Lizenz; die Schriften selbst kopiert Quarto mit dem Theme

execute:
  freeze: auto   # Ergebnisse in _freeze/ – CI braucht dadurch kein R
  echo: false
  warning: false
  message: false

lang: de

# Gruppenmitglieder (author:) stehen in _team.yml – nur dort eintragen.
metadata-files:
  - _team.yml

shortcodes:
  - shortcodes/team.lua

format:
  closeread-html:
    theme: [darkly, styles/steam.scss]
    toc: false
    # keine #-Anker an Überschriften: Screenreader lesen sonst „… Anchor“ mit,
    # sie kosten zehn leere Tab-Stopps und verbreitern die Seite bei 320 px
    anchor-sections: false
    smooth-scroll: false   # Lenis übernimmt (js/smooth-scroll.html)
    code-copy: false       # kein Code auf der Seite: clipboard.js wird nicht gebraucht
    filters:
      - filters/lazy-images.lua
    include-in-header:
      - includes/head.html
    include-after-body:
      # zuerst das Layout: Es soll vor dem ersten Zeichnen umschalten, nicht erst
      # nachdem lenis.min.js geladen ist (sonst springt die Seite am Handy sichtbar)
      - js/linear-layout.html   # schmal/niedrig: Grafiken zwischen die Absätze statt sticky
      - js/smooth-scroll.html
    fig-dpi: 200
    fig-width: 7
    fig-height: 4.5
    fig-align: center
    lightbox: false
    cr-section:
      layout: sidebar-left
    cr-style:
      # transparent: Closeread/Quarto setzen opacity: .999 auf die Sektionen; eine
      # eigene Hintergrundfarbe wird dadurch einen Tick dunkler gerendert (sichtbare Kante)
      section-background-color: "transparent"
      narrative-background-color-sidebar: "transparent"
      narrative-background-color-overlay: "rgba(27, 40, 56, 0.97)"
      narrative-text-color-sidebar: "#dce6ef"
      narrative-text-color-overlay: "#dce6ef"
      narrative-font-size: "1.0625rem"   # = $srb-reading-size in steam.scss
      narrative-border-radius: "2px"
      narrative-sidebar-width: "minmax(20rem, 1fr)"   # Grafikspalte: 2fr
      narrative-overlay-max-width: "520px"
